<!doctype html>
<html lang="ja" class="stone-root">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>地質の分類マップ - いしひろいマップ</title>
    <!-- 日本語の本文用。読み込めなくても端末のゴシック体に落ちるだけで、表示は崩れない -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="styles.css?v=20260923-07">
    <script defer src="data/bundle.js?v=20260920-07"></script>
    <script defer src="data/lithology-detail-bundle.js?v=20260919-10"></script>
    <script defer src="menu.js?v=20260923-03"></script>
    <script defer src="link-preview.js?v=20260921-09"></script>
    <script defer src="tree-layout.js?v=20260921-30"></script>
    <script defer src="litho-tree.js?v=20260921-29"></script>
  </head>
  <body class="stone-page rock-tree-page">
    <header class="stone-header">
      <button id="backButton" class="stone-back-button" type="button" aria-label="前のページに戻る" title="前のページに戻る"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 6l-6 6 6 6"/></svg></button>
    </header>

    <main class="rock-tree">
      <div class="rock-tree-head">
        <h1>地質の分類マップ</h1>
        <p class="rock-tree-sub">地質図に出てくる610種類の地質を、でき方ごとに枝分かれさせて並べています。</p>
        <!-- 見方。見本（札・色の丸）は本物と同じ部品で描いて、木の中で同じものを探せるようにする -->
        <dl class="tree-guide">
          <dt class="tree-guide-mark"><span class="tree-guide-arrow">左 → 右</span></dt>
          <dd>大きな区分（火成岩・変成岩など）から、細かい仲間へ分かれていきます</dd>
          <dt class="tree-guide-mark"><span class="cluster-chip litho-chip tree-branch-metamorphic">泥質片岩<span class="litho-count">15</span></span></dt>
          <dd class="tree-guide-with-button">
            <span>押すと中身が開きます。数字は、中にある地質の数です</span>
            <!-- 読み込み前は押しても何も起きないので隠しておき、litho-tree.js が出す -->
            <button id="openAllButton" class="tree-guide-button" type="button" aria-pressed="false" hidden>
              <!-- 上下に開く矢印。全部開いているあいだは、それぞれ半回転して内向き（閉じる）になる -->
              <svg class="open-all-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path class="open-all-up" d="M8 9.5l4-4 4 4"/>
                <path class="open-all-down" d="M8 14.5l4 4 4-4"/>
              </svg>
              <span class="open-all-label">全部開く</span>
            </button>
          </dd>
          <dt class="tree-guide-mark"><span class="litho-colors" aria-hidden="true"><span class="litho-dot" style="background:#0054ff"></span><span class="litho-dot" style="background:#1da0ff"></span><span class="litho-dot" style="background:#78ffff"></span><span class="litho-dot" style="background:#8cb4ff"></span></span></dt>
          <dd>地図で地質図を重ねたときの色です。時代ごとに色が違い、丸に触れると時代が出ます</dd>
        </dl>
      </div>

      <div id="treeScroll" class="tree-scroll">
        <div id="treeCanvas" class="tree-canvas">
          <p class="tree-loading">読み込んでいます。</p>
        </div>
      </div>
    </main>
  </body>
</html>
