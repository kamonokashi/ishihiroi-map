<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>&#12356;&#12375;&#12402;&#12429;&#12356;&#12510;&#12483;&#12503;</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="styles.css?v=20260920-21">
    <script
      defer
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- file:// で開いたとき用の石データ。サーバー経由なら data/*.json のほうが使われます。 -->
    <script defer src="data/bundle.js?v=20260919-10"></script>
    <script defer src="menu.js?v=20260920-18"></script>
    <script defer src="link-preview.js?v=20260920-17"></script>
    <script defer src="script.js?v=20260920-21"></script>
  </head>
  <!-- 地図の検索結果ではホバーの説明カードを出さない（カードは詳細ページだけのもの） -->
  <body data-link-preview="off">
    <header class="app-header">
      <a class="app-brand" href="index.html">
        <span class="app-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M20 12.4l-5.4 7-8-1.4-2.6-6.4 5-6.8 7.8 1.4z"/>
            <path d="M12 9.6l2.4 2.4-2.4 2.4-2.4-2.4z"/>
          </svg>
        </span>
        <span class="app-brand-text">
          <span class="app-brand-name">いしひろいマップ</span>
          <span class="app-brand-tagline">地質図から石を探す</span>
        </span>
      </a>
    </header>

    <!-- ボタンはヘッダーの外に出して画面に固定する。ヘッダーの中に置くと、ヘッダーが重なり順の
         入れ物になり、ボタンだけを引き出しより前に出せない（押すと引き出しの下に隠れてしまう） -->
    <div class="app-menu">
      <button id="menuButton" class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="appMenu">
        <span class="menu-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
    </div>

    <!-- 右から出てくる引き出し。地図より手前に出すのでヘッダーの外に置く -->
    <div id="menuBackdrop" class="app-menu-backdrop"></div>
    <nav id="appMenu" class="app-menu-drawer" aria-label="メニュー">
      <a class="app-menu-item" href="glossary.html">
        <span class="app-menu-item-text">
          <span class="app-menu-title">用語集</span>
          <span class="app-menu-note">石・鉱物・地質の言葉をさがす</span>
        </span>
        <svg class="app-menu-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg>
      </a>
    </nav>

    <main class="app-shell" id="appShell">
      <section class="map-pane" aria-label="&#22320;&#22259;">
        <div id="map">
          <!-- 地図の上に浮かせる操作まわり。ひとつのまとまりにして、丸いバーにする -->
          <div class="map-overlay">
            <form id="searchForm" class="map-search">
              <button id="locateButton" class="map-round-button" type="button" aria-label="現在地から探す" title="現在地から探す">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.5v3"/><path d="M12 18.5v3"/><path d="M21.5 12h-3"/><path d="M5.5 12h-3"/><circle cx="12" cy="12" r="7.6"/></svg>
              </button>
              <input id="searchInput" type="search" placeholder="場所をさがす（函館、筑波山など）" autocomplete="off">
              <button class="map-round-button is-submit" type="submit" aria-label="検索" title="検索">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.4"/><path d="M15.8 15.8L20.5 20.5"/></svg>
              </button>
            </form>
            <p class="map-place">
              <span class="map-place-label">選択地点</span>
              <span id="selectedPoint">地図をクリックするか、現在地・検索で場所を選んでください。</span>
            </p>
          </div>
        </div>
        <div id="inspectPopupOverlay" class="map-inspect-popup" hidden></div>
        <button id="mapCollapseButton" class="map-collapse-button" type="button" aria-label="&#22320;&#22259;&#12434;&#25240;&#12426;&#12383;&#12383;&#12416;" aria-expanded="true" title="&#22320;&#22259;&#12434;&#25240;&#12426;&#12383;&#12383;&#12416;">
          <svg class="map-panel-handle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15 6l-6 6 6 6"></path>
          </svg>
        </button>
      </section>
      <button id="mapRestoreButton" class="map-restore-button" type="button" aria-label="&#22320;&#22259;&#12434;&#34920;&#31034;" title="&#22320;&#22259;&#12434;&#34920;&#31034;" hidden>
        <svg class="map-panel-handle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M9 6l6 6-6 6"></path>
        </svg>
      </button>

      <aside class="result-pane" aria-live="polite">
        <section class="tabs" aria-label="&#26908;&#32034;&#32080;&#26524;">
          <div class="tab-buttons" role="tablist">
            <button id="rocksTab" class="active" type="button" role="tab" aria-selected="true">&#30707;&#12434;&#35211;&#12427;</button>
            <button id="geologyTab" type="button" role="tab" aria-selected="false">&#22320;&#36074;&#12434;&#35211;&#12427;</button>
          </div>

          <div id="rocksPanel" class="tab-panel active" role="tabpanel" aria-labelledby="rocksTab">
            <p class="empty-message">&#35211;&#12388;&#12363;&#12427;&#21487;&#33021;&#24615;&#12398;&#12354;&#12427;&#30707;&#12434;&#26908;&#32034;&#12391;&#12365;&#12414;&#12377;&#12290;&#12414;&#12378;&#22580;&#25152;&#12434;&#36984;&#12435;&#12391;&#12367;&#12384;&#12373;&#12356;&#12290;</p>
            <div id="rockCards" class="rock-cards"></div>
          </div>

          <div id="geologyPanel" class="tab-panel" role="tabpanel" aria-labelledby="geologyTab">
            <p class="empty-message">&#21462;&#24471;&#12375;&#12383;&#22320;&#36074;&#24773;&#22577;&#12434;&#12371;&#12371;&#12395;&#34920;&#31034;&#12375;&#12414;&#12377;&#12290;</p>
            <div id="geologyList" class="geology-list"></div>
          </div>
        </section>

        <p class="note">
          &#12371;&#12398;&#32080;&#26524;&#12399;&#22320;&#36074;&#22259;&#12434;&#12418;&#12392;&#12395;&#12375;&#12383;&#25512;&#23450;&#12391;&#12377;&#12290;&#23455;&#38555;&#12395;&#35211;&#12388;&#12363;&#12427;&#30707;&#12399;&#12289;&#24029;&#12420;&#28023;&#12395;&#12424;&#12387;&#12390;&#21029;&#12398;&#22320;&#22495;&#12363;&#12425;&#36939;&#12400;&#12428;&#12390;&#12367;&#12427;&#22580;&#21512;&#12364;&#12354;&#12426;&#12414;&#12377;&#12290;
        </p>
      </aside>
    </main>
  </body>
</html>
