<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>&#12356;&#12375;&#12402;&#12429;&#12356;&#12510;&#12483;&#12503;</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <!-- 日本語の本文用。読み込めなくても端末のゴシック体に落ちるだけで、表示は崩れない -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="styles.css?v=20260926-13">
    <script
      defer
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- file:// で開いたとき用の石データ。サーバー経由なら data/*.json のほうが使われます。 -->
    <script defer src="data/bundle.js?v=20260919-10"></script>
    <script defer src="menu.js?v=20260926-01"></script>
    <script defer src="link-preview.js?v=20260926-04"></script>
    <script defer src="script.js?v=20260926-03"></script>
  </head>
  <!-- 地図の検索結果ではホバーの説明カードを出さない（カードは詳細ページだけのもの） -->
  <body data-link-preview="off">
    <!-- 名前は帯（動かない枠）に、検索は地図の上（操作する面）に置く。
         同じ面に丸い札で並べると、どちらが主役か分からなくなる -->
    <header class="app-header">
      <a class="app-brand" href="index.html">
        <span class="app-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M20 12.4l-5.4 7-8-1.4-2.6-6.4 5-6.8 7.8 1.4z"/>
            <path d="M12 9.6l2.4 2.4-2.4 2.4-2.4-2.4z"/>
          </svg>
        </span>
        <span class="app-brand-text">
          <span class="app-brand-name">いしひろいマップ</span>
          <span class="app-brand-tagline">地質図から石を探す</span>
        </span>
      </a>

      <!-- メニューボタンは画面に固定するので、ここでは場所だけ空けておく -->
      <span class="app-header-menu-slot" aria-hidden="true"></span>
    </header>

    <!-- メニュー（ボタン・引き出し）は menu.js が body の終わりに足す -->

    <main class="app-shell" id="appShell">
      <section class="map-pane" aria-label="&#22320;&#22259;">
        <!-- 地図の上に置くのは操作だけ。検索は左上、ズームと地質図の切り替えは右上。
             選んだ地点は結果パネルの見出しに出す（地図の上に出すと、操作と同じ形の帯が並ぶ） -->
        <div id="map">
          <div class="map-search-bar">
            <form id="searchForm" class="map-search">
              <button id="locateButton" class="search-icon-button" type="button" aria-label="現在地から探す" title="現在地から探す">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.5v3"/><path d="M12 18.5v3"/><path d="M21.5 12h-3"/><path d="M5.5 12h-3"/><circle cx="12" cy="12" r="7.6"/></svg>
              </button>
              <input id="searchInput" type="search" placeholder="場所をさがす（函館、筑波山など）" autocomplete="off">
              <button class="search-icon-button is-submit" type="submit" aria-label="検索" title="検索">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.4"/><path d="M15.8 15.8L20.5 20.5"/></svg>
              </button>
            </form>
          </div>
        </div>
        <div id="inspectPopupOverlay" class="map-inspect-popup" hidden></div>
        <button id="mapCollapseButton" class="map-collapse-button" type="button" aria-label="&#22320;&#22259;&#12434;&#25240;&#12426;&#12383;&#12383;&#12416;" aria-expanded="true" title="&#22320;&#22259;&#12434;&#25240;&#12426;&#12383;&#12383;&#12416;">
          <svg class="map-panel-handle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15 6l-6 6 6 6"></path>
          </svg>
        </button>
      </section>
      <button id="mapRestoreButton" class="map-restore-button" type="button" aria-label="&#22320;&#22259;&#12434;&#34920;&#31034;" title="&#22320;&#22259;&#12434;&#34920;&#31034;" hidden>
        <svg class="map-panel-handle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M9 6l6 6-6 6"></path>
        </svg>
      </button>

      <aside class="result-pane" aria-live="polite">
        <section class="tabs" aria-label="&#26908;&#32034;&#32080;&#26524;">
          <div class="result-head">
            <p class="result-place" id="selectedPlace" hidden>
              <span class="result-place-label">選択地点</span>
              <span class="result-place-name" id="selectedPoint"></span>
            </p>
            <!-- 狭い画面では左端の縦書きのしおりになるので、「を見る」を隠して「石」「地質」だけにする -->
            <div class="tab-buttons" role="tablist">
              <button id="rocksTab" class="active" type="button" role="tab" aria-selected="true">石<span class="tab-suffix">を見る</span></button>
              <button id="geologyTab" type="button" role="tab" aria-selected="false">地質<span class="tab-suffix">を見る</span></button>
            </div>
          </div>

          <div id="rocksPanel" class="tab-panel active" role="tabpanel" aria-labelledby="rocksTab">
            <div class="panel-intro">
              <span class="panel-intro-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M12 21.2s7-5.6 7-11.2a7 7 0 1 0-14 0c0 5.6 7 11.2 7 11.2z"/>
                  <circle cx="12" cy="10" r="2.6"/>
                </svg>
              </span>
              <p class="empty-message">まず場所を選んでください</p>
              <ol class="panel-steps">
                <li>地図をクリックするか、上の窓で場所をさがす</li>
                <li>ふきだしの「ここを調べる！」を押す</li>
                <li>その場所で拾えそうな石がここに出ます</li>
              </ol>
            </div>
            <div id="rockCards" class="rock-cards"></div>
          </div>

          <div id="geologyPanel" class="tab-panel" role="tabpanel" aria-labelledby="geologyTab">
            <div class="panel-intro">
              <span class="panel-intro-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M12 3.2l8.4 4.3-8.4 4.3-8.4-4.3z"/>
                  <path d="M4.4 11.6L12 15.5l7.6-3.9"/>
                  <path d="M4.4 15.8L12 19.7l7.6-3.9"/>
                </svg>
              </span>
              <p class="empty-message">取得した地質情報をここに表示します</p>
            </div>
            <div id="geologyList" class="geology-list"></div>
          </div>
        </section>

        <!-- 詳しい注意書き・AIでの制作・出典は about.html。ここはその短い版 -->
        <p class="note">
          この結果は地質図をもとにした推定です。実際に見つかる石は、川や海によって別の地域から運ばれてくる場合があります。
          国立公園や天然記念物の指定地など、石を拾ってはいけない場所もあります。現地の決まりに従ってください。
          このサイトはAIを使って作っています。
          <a href="about.html" target="_blank" rel="opener">くわしくは「このサイトについて」</a>
        </p>
      </aside>
    </main>
  </body>
</html>
