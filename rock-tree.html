<!doctype html>
<html lang="ja" class="stone-root">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>石と鉱物の分類マップ - いしひろいマップ</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- 日本語の本文用。読み込めなくても端末のゴシック体に落ちるだけで、表示は崩れない -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="styles.css?v=20261014-2">
    <script defer src="data/bundle.js?v=20260920-07"></script>
    <script defer src="menu.js?v=20260926-01"></script>
    <script defer src="link-preview.js?v=20260926-04"></script>
    <script defer src="tree-layout.js?v=20260926-01"></script>
    <script defer src="rock-tree.js?v=20260926-01"></script>
  </head>
  <body class="stone-page rock-tree-page">
    <header class="stone-header">
      <button id="backButton" class="stone-back-button" type="button" aria-label="地図に戻る" title="地図に戻る"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 6l-6 6 6 6"/></svg></button>
    </header>

    <main class="rock-tree has-side-tabs">
      <div class="rock-tree-head">
        <h1>分類マップ</h1>
      </div>

      <!-- 石と鉱物の切り替え。画面の左端に縦書きのしおりとして貼り付ける（どの画面幅でも）。
           上下の場所を取らないので、スクロール中も木を見る場所が減らない。
           ヘッダーはサイトの名前や戻る場所のためのもので、操作は入れない -->
      <div class="tree-tabbar">
        <div id="treeSwitch" class="tree-switch" role="tablist" aria-label="分類マップの切り替え" data-active="stone">
          <button id="stoneTab" class="tree-switch-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="treePanel" data-tab="stone">石</button>
          <button id="mineralTab" class="tree-switch-tab" type="button" role="tab" aria-selected="false" aria-controls="treePanel" data-tab="mineral">鉱物</button>
        </div>
      </div>

      <div id="treePanel" role="tabpanel" aria-labelledby="stoneTab">
        <!-- 見方。見本（札・枝）は木の中と同じ部品で描いて、同じものを探せるようにする。石の札の写真は rock-tree.js が入れる -->
        <div data-tab-guide="stone">
          <dl class="tree-guide">
            <dt class="tree-guide-mark"><span class="tree-guide-arrow">左 → 右</span></dt>
            <dd>大きな分け方（火成岩・堆積岩など）から、細かい仲間へ分かれていきます</dd>
            <dt class="tree-guide-mark"><span id="guideStone" class="cluster-chip tree-branch-igneous"><span class="cluster-chip-name">花崗岩</span></span></dt>
            <dd>石の名前です。押すと、その石のくわしいページを開きます。触れると「岩石」までの道筋が濃くなります</dd>
            <dt class="tree-guide-mark"><span class="tree-node tree-branch-igneous tree-guide-node"><span class="tree-node-name">深成岩</span></span></dt>
            <dd>枝の名前です。押すと、その言葉の説明を開きます</dd>
          </dl>
        </div>

        <div data-tab-guide="mineral" hidden>
          <dl class="tree-guide">
            <dt class="tree-guide-mark"><span class="tree-guide-arrow">左 → 右</span></dt>
            <dd>何でできているか（ケイ酸塩・炭酸塩など）から、細かい仲間へ分かれていきます</dd>
            <dt class="tree-guide-mark"><span class="cluster-chip mineral-chip tree-branch-silicate"><span class="cluster-chip-name">石英</span></span></dt>
            <dd>鉱物の名前です。押すと、その鉱物のくわしいページを開きます</dd>
            <dt class="tree-guide-mark"><span class="tree-node tree-branch-silicate tree-guide-node"><span class="tree-node-name">骨組みが鎖</span></span></dt>
            <dd>岩石の鉱物のほとんどはケイ酸塩鉱物です。ケイ素と酸素の骨組みのつながり方で分け、上ほどばらばら、下ほど立体につながります</dd>
          </dl>
        </div>

        <div id="treeScroll" class="tree-scroll">
          <div id="treeCanvas" class="tree-canvas">
            <p class="tree-loading">読み込んでいます。</p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
